name: ci-experiment

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run static analysis
        run: ruff check .

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run automated tests
        run: |
          mkdir -p test-results
          pytest \
            --junitxml=test-results/junit.xml \
            --json-report \
            --json-report-file=test-results/report.json \
            --durations=10

      - name: Build test metrics
        if: always()
        run: |
          python scripts/build_test_metrics.py \
            --junitxml test-results/junit.xml \
            --output test-results/test-metrics.json

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/

  summarize:
    runs-on: ubuntu-latest
    needs:
      - lint
      - tests
    if: always()
    steps:
      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: downloaded-test-results

      - name: Publish summary
        run: |
          echo "## CI/CD experiment summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run ID: $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workflow result (lint): ${{ needs.lint.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workflow result (tests): ${{ needs.tests.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### test-metrics.json" >> "$GITHUB_STEP_SUMMARY"
          cat downloaded-test-results/test-metrics.json >> "$GITHUB_STEP_SUMMARY"

