[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-cd-pipeline-experiment"
version = "0.1.0"
description = "Projeto base para instrumentacao e analise de pipeline CI/CD no GitHub Actions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "matplotlib>=3.8",
  "pandas>=2.2",
  "pytest>=8.2",
  "pytest-json-report>=1.5",
  "requests>=2.32",
  "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools.packages.find]
where = ["src"]

